<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dehazer</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="src/app.css">
</head>
<body>
  <main>
    <h1>Dehazer</h1>
    <form id="capture" autocomplete="off">
      <label for="text">Capture a thought</label>
      <input id="text" name="text" type="text" maxlength="2000" placeholder="What is on your mind?">
      <button type="submit">Save</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <p id="notice" hidden></p>
    <section aria-labelledby="next-h">
      <h2 id="next-h">Next 5</h2>
      <ol id="next5"></ol>
      <p id="next-empty" hidden>Nothing waiting. Capture a thought above.</p>
    </section>
    <div id="tools">
      <button type="button" id="export">Export</button>
      <label for="import">Import a Markdown file</label>
      <input id="import" type="file" accept=".md,text/markdown,text/plain">
    </div>
    <p id="backup" hidden>It has been a while. You can save a copy with Export.</p>
    <h2>All items</h2>
    <ul id="items" aria-label="Your items"></ul>
    <p id="empty">Nothing here yet.</p>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
